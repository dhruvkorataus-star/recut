services:
  - type: web
    name: recut-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: YOUTUBE_DL_SKIP_PYTHON_CHECK
        value: "1"
      - key: TRANSCRIBE_PROVIDER
        value: groq
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
